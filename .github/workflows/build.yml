# Compila o APK automaticamente a cada envio de código.
# O APK aparece em: GitHub → aba "Releases" (e também em "Actions" → execução → "Artifacts").
name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes (cálculo e leitores)
        run: ./gradlew :calculo:test :leitores:test --stacktrace

      - name: Compilar APK de teste
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "driverapp-teste-${{ github.run_number }}.apk"

      - name: Guardar APK (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: driverapp-teste-${{ github.run_number }}
          path: driverapp-teste-${{ github.run_number }}.apk

      - name: Publicar em Releases (download direto pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teste-${{ github.run_number }}
          name: Versão de teste ${{ github.run_number }}
          prerelease: true
          body: |
            APK de teste gerado automaticamente.
            Commit: ${{ github.sha }}
            Instale por cima da versão anterior (não precisa desinstalar).
          files: driverapp-teste-${{ github.run_number }}.apk
